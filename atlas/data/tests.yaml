- id: hop-tests
  type: test
  title: Hop Test Battery (Noyes)
  page: 8
  summary: Single, triple, crossover and 6-m timed hops — compare involved with uninvolved limb.
  steps:
  - Warm-up and practice trials; 2 recorded trials per leg, best or average.
  - 'Single and triple hop: distance (land and hold).'
  - 'Crossover hop: three hops crossing a 15 cm line.'
  - '6-m timed hop: time over 6 m.'
  - 'LSI = involved ÷ uninvolved × 100 (timed: uninvolved ÷ involved × 100).'
  positive: LSI ≥ 90% for each test.
  evidence: M
  video_url: https://www.youtube.com/watch?v=mZk26NvfIVI
