- id: eswt-knee
  type: info
  title: Shockwave Therapy (ESWT) at the Knee
  page: 6
  summary: Patellar tendinopathy is an ISMST approved standard indication; pes anserine tendinopathy, Osgood-Schlatter and knee OA are empirically tested uses.
  steps:
  - Combine with progressive tendon loading — ESWT is an adjunct.
  - 'Typical: 3–5 sessions at weekly intervals.'
  - Focused 0.10–0.30 mJ/mm² (1500–2000 pulses) or radial 2.0–3.0 bar (2000–3000 pulses) for patellar tendinopathy.
  - Use low energy over open growth plates (Osgood-Schlatter).
  evidence: M
  cautions: 'ISMST contraindications: malignant tumour, fetus or pacemaker in the shockwave field. Avoid with recent fluoroquinolone use or tendon steroid injection.'
  video_url: null
  sources:
  - text: ISMST — Indications and contraindications for shockwave therapy
    url: https://shockwavetherapy.org/indications/
    free_full_text: true
  review_status: approved
- id: nmes-quadriceps
  type: info
  title: Quadriceps NMES — Set-Up & Dosing
  page: 6
  summary: Restores quadriceps strength after TKA (high-quality evidence) and ACL reconstruction.
  steps:
  - 'Electrodes: one over the VMO motor point, one over the proximal lateral thigh.'
  - Knee at ~60°, strap-resisted (isometric).
  - Biphasic symmetric current, 30–50 Hz, 250–400 µs, 10–15 s on / 45–50 s off.
  - Turn intensity to the maximum tolerated — the training effect depends on contraction intensity.
  - 'After TKA: 15 contractions, twice daily from 48 h, for 6 weeks.'
  interpretation: Strength gains at 3.5 weeks after TKA were related to NMES intensity (R² 0.68).
  evidence: H
  video_url: null
  sources:
  - text: Jette DU et al. Physical therapist management of total knee arthroplasty (CPG). Phys Ther 2020;100:1603-31
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7462050/
    free_full_text: true
  - text: Stevens-Lapsley JE et al. Relationship between intensity of quadriceps NMES and strength recovery after TKA. Phys Ther 2012;92:1187-96
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3432951/
    free_full_text: true
  - &id010
    text: Kotsifaki R et al. Aspetar clinical practice guideline on rehabilitation after ACL reconstruction. BJSM 2023;57:500-14
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11785408/
    free_full_text: true
  review_status: approved
- id: tens-dosing
  type: info
  title: TENS — Dosing & Tolerance
  page: 6
  summary: Short-term pain relief; intensity is the key parameter.
  steps:
  - 'Conventional: 80–120 Hz, 50–100 µs, strong but comfortable, during activity.'
  - 'Acupuncture-like: 2–4 Hz, visible rhythmic contraction, 20–30 min.'
  - Daily identical settings lead to tolerance; vary frequency or use mixed modes.
  evidence: L
  cautions: 'NICE 2022: TENS is not recommended for osteoarthritis. Not recommended for patellofemoral pain (2016 consensus).'
  video_url: null
  sources:
  - *id007
  - *id008
  review_status: approved
- id: knee-manual-therapy
  type: info
  title: Knee Manual Therapy
  page: 7
  summary: Joint mobilisation to restore extension / flexion and modulate pain — always paired with exercise.
  steps:
  - 'Tibiofemoral PA glide for extension, AP glide for flexion: grades III–IV, 3 × 30–60 s.'
  - Patellar glides after surgery to prevent stiffness and patella infera (avoid lateral glides after MPFL reconstruction).
  - 'Mulligan mobilisation with movement: tibial rotation glide during painful flexion / extension, only if pain-free.'
  evidence: M
  cautions: 'Knee OA: manual therapy only alongside exercise (NICE). Patellofemoral pain: mobilisation not recommended (2016 consensus).'
  video_url: null
  sources:
  - *id007
  - *id008
  review_status: approved
- id: dry-needling-knee
  type: info
  title: Dry Needling Around the Knee — Safety
  page: 7
  summary: Know the neurovascular anatomy before needling the thigh and posterior knee.
  steps:
  - 'Vastus medialis: stay anterior to sartorius (femoral vessels in the adductor canal).'
  - 'Rectus femoris: avoid the femoral triangle.'
  - 'Distal biceps femoris: the common peroneal nerve runs medial to the tendon — aim laterally.'
  - Never needle the centre of the popliteal fossa (popliteal artery, vein, tibial nerve).
  - No needling into the joint or near a knee replacement.
  evidence: E
  cautions: 'NICE 2022: do not offer acupuncture or dry needling for osteoarthritis.'
  video_url: null
  sources:
  - *id007
  review_status: approved
- id: cupping-knee
  type: info
  title: Cupping — Parameters & Safety
  page: 7
  summary: Dry, dynamic and movement-based cupping are low-evidence adjuncts; wet cupping breaches the skin.
  steps:
  - 'Static dry cupping: light–moderate suction, 5–10 min.'
  - 'Dynamic (sliding): lubricant, light suction, 3–5 min along the fibres.'
  - 'Cupping with movement: cup in place + active knee motion, 2–3 min.'
  - 'Wet cupping: sterile single-use equipment and bloodborne-pathogen precautions; confirm scope of practice and licensure.'
  evidence: L
  cautions: Avoid with anticoagulants / bleeding disorders, fragile skin, DVT or varicosities, unhealed incisions, neuropathy, active infection.
  video_url: null
  sources: []
  review_status: approved
- id: tendon-loading-knee
  type: info
  title: Progressive Tendon-Loading Programme (Patellar Tendon)
  page: 8
  summary: Four stages progressed by pain response — superior to eccentric decline squats in a randomised trial.
  steps:
  - 'Stage 1 — isometric: single-leg leg press or leg extension at 60°, 5 × 45 s at ~70% MVC, daily.'
  - 'Stage 2 — isotonic: heavy, slow resistance (3 s up / 3 s down), progressing 15RM → 6RM.'
  - 'Stage 3 — energy storage: jumps, hops and bounding, every 2–3 days.'
  - 'Stage 4 — sport-specific: return to training, then competition.'
  - Progress when single-leg squat pain is ≤ 3/10 and the stage has been done for ≥ 1 week.
  metrics: VISA-P +28 vs +18 points at 24 weeks (progressive loading vs eccentric).
  evidence: M
  video_url: null
  sources:
  - *id006
  - *id009
  - text: Rio E et al. Isometric exercise induces analgesia and reduces inhibition in patellar tendinopathy. BJSM 2015;49:1277-83
    url: https://doi.org/10.1136/bjsports-2014-094386
  review_status: approved
- id: bfr-knee
  type: info
  title: Blood Flow Restriction (BFR) — Lower Limb
  page: 8
  summary: Low-load training with partial vascular occlusion to build strength when heavy loads are not yet allowed.
  steps:
  - Measure arterial occlusion pressure (AOP) with the cuff on the proximal thigh (Doppler or device).
  - 'Working pressure: 40–80% of AOP.'
  - 'Load 20–40% of 1RM: 30-15-15-15 repetitions, 30–60 s rest between sets.'
  - Restriction time 5–10 min per exercise, then deflate (reperfusion) between exercises; 2–3 sessions per week.
  evidence: M
  cautions: 'Exclude: history of DVT / VTE, peripheral arterial disease, sickle cell, uncontrolled hypertension, pregnancy, infection or malignancy. Cuff never below the knee.'
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: aop
      label: Arterial occlusion pressure (mmHg)
      type: number
    expr: aop
    value_label: AOP (mmHg)
    decimals: 0
    outputs:
    - when: v>0
      text: 'Working range 40–80% AOP: {aop*0.4|0} – {aop*0.8|0} mmHg (60% = {aop*0.6|0})'
      tone: good
  sources:
  - text: 'Patterson SD et al. Blood flow restriction exercise: considerations of methodology, application, and safety. Front Physiol 2019;10:533'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6530612/
    free_full_text: true
  - *id010
  review_status: approved
- id: return-to-running
  type: info
  title: Return-to-Running Gate After ACL Reconstruction
  page: 8
  summary: Most studies allow running at ~12 weeks on time alone; add clinical criteria.
  steps:
  - ≥ 12 weeks after surgery.
  - Full extension and ≥ 95% flexion.
  - Effusion trace or less.
  - Pain ≤ 2/10.
  - Quadriceps LSI > 80% (> 70% minimum reported).
  - Pain-free repeated single-leg hopping.
  interpretation: Criteria are expert consensus — research has not tested them.
  evidence: E
  video_url: null
  sources:
  - text: 'Rambaud AJM et al. Criteria for return to running after ACL reconstruction: a scoping review. BJSM 2018;52:1437-44'
    url: https://doi.org/10.1136/bjsports-2017-098602
  - *id010
  review_status: approved
- id: rts-battery-knee
  type: info
  title: Return-to-Sport Battery After ACL Reconstruction
  page: 8
  summary: Passing objective criteria and waiting until at least 9 months lowers reinjury risk.
  steps:
  - 'Quadriceps strength and four hop tests: LSI ≥ 90%.'
  - Patient-reported knee function ≥ 90% (KOS-ADLS, global rating).
  - Landing quality, balance, change of direction and psychological readiness.
  - Delay return to at least 9 months after surgery.
  interpretation: 'Each month of delay up to 9 months: reinjury −51%. Each 1% gain in quadriceps symmetry: reinjury −3%. Not meeting all discharge criteria: 4× graft rupture risk. LSI overestimates recovery because the other leg deconditions too.'
  evidence: M
  video_url: null
  calculator:
    kind: lsi
    threshold: 90
    rows:
    - label: Quadriceps strength
      mode: higher
    - label: Hamstring strength
      mode: higher
    - label: Single hop (cm)
      mode: higher
    - label: Triple hop (cm)
      mode: higher
    - label: Crossover hop (cm)
      mode: higher
    - label: 6-m timed hop (s)
      mode: time
  sources:
  - *id011
