- id: tsk-11
  type: info
  title: TSK-11 — Tampa Scale of Kinesiophobia
  page: 8
  summary: 11 items scored 1–4 (total 11–44); higher = more fear of movement / reinjury.
  steps:
  - Patient rates each item 1 (strongly disagree) to 4 (strongly agree).
  - Sum the 11 items.
  interpretation: No validated cut-off — follow the trend and address fear with graded exposure.
  evidence: M
  video_url: null
