- id: oxford-knee-score
  type: info
  title: Oxford Knee Score (OKS)
  page: 4
  summary: 12 items scored 0–4, total 0–48 (48 = best), for knee OA and arthroplasty.
  steps:
  - Patient completes the 12 items (past 4 weeks).
  - Sum the scores (0–48).
  interpretation: Minimal important change for an individual ≈ 7 points; between groups ≈ 5 points.
  evidence: H
  video_url: null
  calculator:
    kind: scale
    items: 12
    min: 0
    max: 4
    order: desc
    note: 'Item topics are summarised; ask each question in the official wording (licensed by Oxford University Innovation). Each answer: 4 = best … 0 = worst.'
    item_labels:
    - Usual knee pain (past 4 weeks)
    - Trouble washing and drying yourself
    - Trouble getting in / out of a car or public transport
    - How long you can walk before knee pain becomes severe
    - Pain standing up from a chair after a meal
    - Limping when walking
    - Kneeling down and getting up again
    - Knee pain disturbing sleep at night
    - Knee pain interfering with usual work / housework
    - Knee feeling it may suddenly give way
    - Doing household shopping on your own
    - Walking down one flight of stairs
    option_labels:
      4: 4 · none / no trouble / no time limit
      3: 3 · mild / a little
      2: 2 · moderate
      1: 1 · severe / extreme difficulty
      0: 0 · unbearable / impossible / all the time
    aggregate: sum
    decimals: 0
    value_label: Oxford Knee Score (0–48)
    bands: []
  sources:
  - text: Beard DJ et al. Meaningful changes for the Oxford hip and knee scores after joint replacement surgery. J Clin Epidemiol 2015;68:73-9
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4270450/
    free_full_text: true
  review_status: approved
- id: acl-rsi
  type: info
  title: ACL-RSI — Psychological Readiness
  page: 4
  summary: 12 items on emotions, confidence and risk appraisal about returning to sport (0–100).
  steps:
  - Patient rates each item; the score is the mean (0–100, higher = more ready).
  - Repeat at 6 months and before return to sport.
  interpretation: No universal cut-off. 6-month scores predict return to sport at 12 months fairly well (AUC 0.77). Typical scores rise from ~44 before surgery to ~62 at 3–6 months.
  evidence: M
  video_url: null
  calculator:
    kind: scale
    items: 12
    min: 0
    max: 100
    step: 10
    order: desc
    note: 'Item topics are summarised; use the official form for exact wording. Every item is scored so that 100 = most ready (e.g. not nervous at all, not likely to re-injure).'
    item_labels:
    - Confident you can perform at your previous level of sport
    - Likelihood of re-injuring the knee by playing (unlikely = 100)
    - Nervous about playing your sport (not nervous = 100)
    - Confident the knee will not give way during sport
    - Confident you could play without concern for the knee
    - Frustrated at having to consider the knee in sport (not = 100)
    - Fearful of re-injuring the knee by playing (not = 100)
    - Confident the knee will hold up under pressure
    - Afraid of accidentally injuring the knee in sport (not = 100)
    - Thoughts of repeat surgery / rehab stopping you playing (not = 100)
    - Confident in your ability to perform well at your sport
    - Relaxed about playing your sport
    option_labels:
      100: 100 · best (most ready)
      0: 0 · worst
