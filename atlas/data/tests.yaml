    - range10: strong / severe pain
    - range10: strong / severe pain
    - range10: strong / severe pain
    - range10: unable
    - range10: strong / severe pain / unable
    - [[0, 'Not at all'], [4, 'Modified training ± modified competition'], [7, 'Full training ± competition, below previous level'], [10, 'Competing at the same or higher level']]
    - - group: 'A · No pain while doing sport — how long can you train?'
