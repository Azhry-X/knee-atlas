- id: ottawa-knee-rule
  type: info
  title: Ottawa Knee Rule (with exclusions)
  page: 1
  summary: Decides who needs a knee radiograph after acute knee trauma. A negative rule safely avoids an X-ray.
  steps:
  - 'Check exclusions first: injury older than 7 days, pregnancy, altered consciousness, paraplegia, multiple or distracting injuries, isolated skin injury.'
  - Palpate the head of the fibula and the patella (note whether patellar tenderness is isolated).
  - 'Ask the patient to flex the knee: can they reach 90°?'
  - Ask the patient to take 4 steps (two transfers onto each leg), both immediately after injury and now; limping counts as able.
  positive: 'Any one finding: age ≥ 55 · isolated patellar tenderness · fibular head tenderness · unable to flex to 90° · unable to bear weight for 4 steps → knee radiograph.'
  interpretation: 'Built for 100% sensitivity, so specificity is modest: a positive rule means "X-ray", not "fracture".'
  metrics: 'Pooled Sn 98.5% · Sp 48.6% · −LR 0.05 (Bachmann 2004). Children: Sn 100% (Bulloch 2003).'
  evidence: H
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: a
      label: Age ≥ 55
      type: check
    - key: p
      label: Isolated tenderness of the patella
      type: check
    - key: f
      label: Tenderness at the head of the fibula
      type: check
    - key: k
      label: Unable to flex the knee to 90°
      type: check
    - key: w
      label: Unable to bear weight for 4 steps (immediately and now)
      type: check
    expr: a+p+f+k+w
    outputs:
    - when: v>=1
      text: Positive → knee radiograph indicated
      tone: bad
    - when: v==0
      text: Negative → radiograph not required (check exclusions)
      tone: good
  sources:
  - text: 'Bachmann LM et al. Accuracy of the Ottawa knee rule to rule out knee fractures: a systematic review. Ann Intern Med 2004;140:121-4'
    url: https://doi.org/10.7326/0003-4819-140-5-200403020-00013
  - text: 'Bulloch B et al. Validation of the Ottawa Knee Rule in children: a multicenter study. Ann Emerg Med 2003;42:48-55'
    url: https://doi.org/10.1067/mem.2003.196
  review_status: approved
- id: pittsburgh-knee-rule
  type: info
  title: Pittsburgh Knee Rule
  page: 1
  summary: Alternative decision rule that also covers children and older adults; more specific than Ottawa in its validation study.
  steps:
  - Confirm the mechanism was blunt trauma or a fall.
  - Record the age.
  - Ask the patient to take 4 weight-bearing steps.
  positive: Blunt trauma / fall AND (age < 12 or > 50 OR unable to take 4 weight-bearing steps) → radiograph.
  metrics: 'Sn 99% · Sp 60% (Ottawa in the same cohort: Sn 97% · Sp 27%).'
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: m
      label: 'Mechanism: blunt trauma or fall'
      type: check
    - key: age
      label: Age (years)
      type: number
    - key: w
      label: Unable to take 4 weight-bearing steps
      type: check
    expr: '!m ? 0 : ((w || age<12 || age>50) ? 1 : (isNaN(age) ? NaN : 0))'
    outputs:
    - when: '!m'
      text: Applies only after blunt trauma or a fall
      tone: warn
    - when: v==1
      text: Positive → radiograph indicated
      tone: bad
    - when: v==0
      text: Negative by Pittsburgh criteria
      tone: good
  sources:
  - text: Seaberg DC et al. Multicenter comparison of two clinical decision rules for radiography in acute, high-risk knee injuries. Ann Emerg Med 1998;32:8-13
    url: https://doi.org/10.1016/s0196-0644(98)70092-7
  review_status: approved
- id: knee-dislocation-abi
  type: info
  title: Knee Dislocation — Vascular Screen (ABI)
  page: 1
  summary: Multiligament injury can mean a dislocation that has already reduced itself. The popliteal artery is at risk.
  steps:
  - Suspect it with gross instability in extension, ≥ 2 ligaments injured, or a high-energy mechanism.
  - Palpate dorsalis pedis and posterior tibial pulses on both sides; check capillary refill.
  - Measure ankle systolic pressure (Doppler) and brachial systolic pressure.
  - ABI = ankle systolic ÷ brachial systolic.
  - Test the common peroneal nerve (ankle dorsiflexion, dorsum-foot sensation).
  positive: ABI < 0.90 → arterial injury likely → immediate CT angiography / vascular surgery. Normal ABI still needs serial review.
  metrics: 'ABI < 0.90: Sn 100% · Sp 100% · NPV 100% in 38 patients (Mills 2004).'
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: ank
      label: Ankle systolic pressure (mmHg)
      type: number
    - key: bra
      label: Brachial systolic pressure (mmHg)
      type: number
    expr: ank/bra
    value_label: ABI
    decimals: 2
    outputs:
    - when: v<0.9
      text: ABI < 0.90 → vascular emergency (CTA)
      tone: bad
    - when: v>=0.9
      text: ABI ≥ 0.90 → serial pulse checks still required
      tone: good
  sources:
  - text: Mills WJ et al. The value of the ankle-brachial index for diagnosing arterial injury after knee dislocation. J Trauma 2004;56:1261-5
    url: https://doi.org/10.1097/01.ta.0000068995.63201.0b
  review_status: approved
- id: extensor-mechanism
  type: test
  title: Extensor Mechanism — Active SLR & Extensor Lag
  page: 1
  summary: Screens for quadriceps or patellar tendon rupture, patellar fracture and quadriceps inhibition.
  steps:
  - Supine, knee fully extended. Ask the patient to lift the straight leg 20–30 cm and hold.
  - 'Watch the knee: does it stay locked in full extension?'
  - 'If it bends, measure the lag: the gap between passive and active extension (°).'
  - Palpate above and below the patella for a defect; compare patellar height with the other side.
  positive: Unable to lift the straight leg or hold full extension, with a palpable gap or abnormal patellar height → extensor mechanism rupture until proven otherwise.
  interpretation: Lag with an intact mechanism (post-op, effusion) = quadriceps inhibition → NMES, cryotherapy, effusion control.
  evidence: E
  video_url: null
  sources: []
  review_status: approved
- id: compartment-delta-p
  type: info
  title: Compartment Syndrome — 6 Ps & ΔP
  page: 1
  summary: Can follow tibial plateau fractures, crush injury or surgery. Pain on passive stretch is the earliest sign.
  steps:
  - 'Screen: pain out of proportion / on passive stretch, paraesthesia, pallor, paralysis, pulselessness, poikilothermia.'
  - Late signs (pulselessness, paralysis) mean the window is closing.
  - 'Pressure measurement is a medical procedure. PT role: recognise and refer immediately.'
  positive: Suspected compartment syndrome → emergency referral. Surgeons use ΔP = diastolic BP − compartment pressure; ΔP ≤ 30 mmHg = fasciotomy.
  metrics: ΔP ≤ 30 mmHg threshold (McQueen 1996).
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: d
      label: Diastolic BP (mmHg)
      type: number
    - key: c
      label: Compartment pressure (mmHg) — measured by the medical team
      type: number
    expr: d-c
    value_label: ΔP (mmHg)
    decimals: 0
    outputs:
    - when: v<=30
      text: ΔP ≤ 30 mmHg → emergency fasciotomy territory
      tone: bad
    - when: v>30
      text: ΔP > 30 mmHg → keep monitoring clinically
      tone: warn
  sources:
  - text: 'McQueen MM, Court-Brown CM. Compartment monitoring in tibial fractures: the pressure threshold for decompression. J Bone Joint Surg Br 1996;78:99-104'
    url: https://doi.org/10.1302/0301-620x.78b1.0780099
  review_status: approved
- id: septic-arthritis-knee
  type: info
  title: Septic Arthritis of the Knee
  page: 1
  summary: A hot, swollen knee is septic until proven otherwise — joint destruction can start within days.
  steps:
  - Ask about fever, recent injection, arthroscopy, arthroplasty, skin breaks, immunosuppression, diabetes, IV drug use.
  - Look for warmth, tense effusion, severe pain on any movement, inability to bear weight.
  - Do not mobilise, needle or load the joint. Refer the same day for aspiration.
  positive: Suspicion alone is enough for same-day emergency referral.
  metrics: 'Synovial WBC > 50,000/µL: LR+ 7.7; > 100,000/µL: LR+ 28 (Margaretten 2007).'
  evidence: H
  video_url: null
  sources:
  - text: Margaretten ME et al. Does this adult patient have septic arthritis? JAMA 2007;297:1478-88
    url: https://doi.org/10.1001/jama.297.13.1478
  review_status: approved
- id: scfe-hip-screen
  type: info
  title: Hip Screen — SCFE / Referred Knee Pain
  page: 1
  summary: Hip pathology refers to the knee. In adolescents, slipped capital femoral epiphysis (SCFE) is the classic miss.
  steps:
  - 'Any child or adolescent with knee or thigh pain and a limp: examine the hip.'
  - Passive hip internal rotation in 90° flexion, compared with the other side.
  - 'Flex the hip: does the thigh swing into external rotation (Drehmann sign)?'
  - 'Adults: hip OA often refers to the knee — screen hip ROM and FADIR / FABER.'
  positive: Adolescent + reduced or painful hip IR / obligatory external rotation on flexion → urgent hip X-ray (AP + frog-leg) and non-weight-bearing.
  evidence: E
  video_url: null
  sources: []
  review_status: approved
- id: budapest-crps
  type: info
  title: Budapest Criteria — CRPS
  page: 1
  summary: Clinical criteria for complex regional pain syndrome after injury or surgery.
  steps:
  - 'Gate 1: continuing pain disproportionate to the inciting event.'
  - 'Gate 2: no other diagnosis better explains the picture.'
  - 'Symptoms: ≥ 1 reported in ≥ 3 of 4 categories (sensory, vasomotor, sudomotor/oedema, motor/trophic).'
  - 'Signs: ≥ 1 observed at evaluation in ≥ 2 of 4 categories.'
  positive: Both gates + ≥ 3/4 symptom categories + ≥ 2/4 sign categories.
  evidence: H
  video_url: null
  calculator:
    kind: formula
    inputs:
    - heading: Mandatory gates
    - key: g1
      label: Continuing pain disproportionate to the inciting event
      type: check
    - key: g2
      label: No other diagnosis better explains the signs and symptoms
      type: check
    - heading: Symptoms reported (categories)
    - key: s1
      label: 'Sensory: hyperaesthesia / allodynia'
      type: check
    - key: s2
      label: 'Vasomotor: temperature / skin colour asymmetry'
      type: check
    - key: s3
      label: 'Sudomotor / oedema: swelling or sweating asymmetry'
      type: check
    - key: s4
      label: 'Motor / trophic: ↓ ROM, weakness, tremor, hair / nail / skin change'
      type: check
    - heading: Signs observed (categories)
    - key: n1
      label: 'Sensory: hyperalgesia (pinprick) / allodynia'
      type: check
    - key: n2
      label: 'Vasomotor: temperature / colour asymmetry'
      type: check
    - key: n3
      label: Sudomotor / oedema
      type: check
    - key: n4
      label: Motor / trophic
      type: check
    expr: (g1&&g2&&(s1+s2+s3+s4)>=3&&(n1+n2+n3+n4)>=2)?1:0
    outputs:
    - when: v==1
      text: Budapest criteria MET → medical referral, graded activity
      tone: bad
    - when: v==0
      text: Criteria not met (check both gates, ≥ 3 symptom and ≥ 2 sign categories)
      tone: good
  sources:
  - text: Harden RN et al. Validation of proposed diagnostic criteria (the "Budapest Criteria") for CRPS. Pain 2010;150:268-74
    url: https://doi.org/10.1016/j.pain.2010.04.030
  review_status: approved
- id: stroke-test
  type: test
  title: Stroke (Sweep) Test — Effusion Grading
  page: 1
  summary: Grades knee effusion reliably; the grade drives how much load the knee can take.
  steps:
  - Supine, knee extended and relaxed.
  - Stroke upward along the medial side from joint line to suprapatellar pouch 2–3 times.
  - Stroke downward along the lateral side and watch the medial sulcus for a returning wave.
  positive: '0: no wave · Trace: small wave medially · 1+: larger bulge medially · 2+: fluid returns medially without the downstroke · 3+: fluid cannot be moved out of the medial side.'
  interpretation: 'Use the grade to dose activity: rising effusion after a session = too much load.'
  metrics: Inter-rater κ 0.75; 73% exact agreement (Sturgill 2009).
  evidence: M
  video_url: https://www.youtube.com/watch?v=ySpqA-K5kjo
  video_title: Brush / Stroke / Bulge / Swipe Test⎟Knee Swelling
  sources:
  - text: Sturgill LP et al. Interrater reliability of a clinical scale to assess knee joint effusion. JOSPT 2009;39:845-9
    url: https://doi.org/10.2519/jospt.2009.3143
  review_status: approved
- id: single-leg-squat
  type: test
  title: Single-Leg Squat — Movement Quality
  page: 1
  summary: Five-repetition single-leg squat rated good / fair / poor; poor performance tracks with weaker hip abductors.
  steps:
  - Arms crossed, stand on the test leg; squat to ~60° knee flexion and return, 5 times at ~1 s per rep.
  - Rate overall impression, trunk posture, pelvis "in space", hip joint and knee joint.
  - 'Common faults: trunk lean, pelvic drop, hip adduction / internal rotation, knee valgus.'
  positive: Poor = most criteria not met; consider hip abductor / external rotator strengthening.
  metrics: Good performers had earlier gluteus medius onset and greater hip abduction strength (Crossley 2011).
  evidence: M
  video_url: https://www.youtube.com/watch?v=y-v4seZ7eZ8
  video_title: What to Assess in Single Leg Bend Tasks | Knee Stability
  sources:
  - text: Crossley KM et al. Performance on the single-leg squat task indicates hip abductor muscle function. Am J Sports Med 2011;39:866-73
    url: https://doi.org/10.1177/0363546510395456
  review_status: approved
- id: psfs
  type: info
  title: Patient-Specific Functional Scale (PSFS)
  page: 1
  summary: The patient names up to 3 important activities they find hard and rates each 0 (unable) to 10 (pre-injury level).
  steps:
  - 'Ask: "Name up to three activities you are unable to do or have difficulty with because of your knee."'
  - Rate each 0–10. Re-rate the same activities at each review.
  interpretation: Track the average score.
  metrics: Minimal detectable change ≈ 2 points (average score) · 3 points (single activity).
  evidence: M
  video_url: null
  calculator:
    kind: scale
    items: 3
    min: 0
    max: 10
    item_label: Activity
    note: Patient names up to 3 activities they have difficulty with, then rates each.
    option_labels:
      0: 0 · unable to perform
      10: 10 · able at pre-injury level
    aggregate: mean
    decimals: 1
    value_label: PSFS average
    bands: []
  sources:
  - text: 'Stratford P et al. Assessing disability and change on individual patients: a report of a patient specific measure. Physiother Can 1995;47:258-63'
    url: https://doi.org/10.3138/ptc.47.4.258
  review_status: approved
- id: pfp-diagnosis
  type: info
  title: Patellofemoral Pain — Diagnosis
  page: 2
  summary: Diagnosis is clinical and by exclusion; there is no single confirmatory test.
  steps:
  - Pain around or behind the patella.
  - 'Reproduce it with patellofemoral-loading tasks: squatting (most sensitive), stairs, prolonged sitting, kneeling, jumping or running.'
  - 'Exclude other causes: tendinopathy, fat pad, instability, referred hip pain, OA, plica.'
  positive: All three criteria met → PFP.
  interpretation: 'First-line treatment: combined hip + knee exercise. Mobilisation and electrophysical agents are not recommended.'
  evidence: M
  video_url: null
  sources:
  - text: 'Crossley KM et al. 2016 Patellofemoral pain consensus statement, Part 1: terminology, definitions, clinical examination. BJSM 2016;50:839-43'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4975817/
    free_full_text: true
  - &id008
    text: 'Crossley KM et al. 2016 Patellofemoral pain consensus statement, Part 2: recommended physical interventions. BJSM 2016;50:844-52'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4975825/
    free_full_text: true
  - text: 'Willy RW et al. Patellofemoral Pain: clinical practice guideline. JOSPT 2019;49(9):CPG1-CPG95'
    url: https://doi.org/10.2519/jospt.2019.0302
  review_status: approved
- id: patellar-tendinopathy
  type: info
  title: Patellar Tendinopathy — Clinical Diagnosis
  page: 2
  summary: Pain localised to the inferior pole of the patella that rises with energy-storage load (jumping, change of direction).
  steps:
  - Confirm pain is localised to the inferior pole / proximal tendon.
  - 'Load test: single-leg decline squat — rate pain 0–10.'
  - Pain should increase as load increases and warm up during activity.
  - Palpation tenderness supports but does not confirm (common in asymptomatic athletes).
  positive: Localised inferior-pole pain + load-dependent behaviour.
  evidence: M
  video_url: https://www.youtube.com/watch?v=44g1ZNwfcOo
  video_title: How to Diagnose Patellar Tendinopathy | Jumper's Knee Diagnosis
  sources:
  - &id009
    text: 'Malliaras P et al. Patellar tendinopathy: clinical diagnosis, load management, and advice for challenging case presentations. JOSPT 2015;45:887-98'
    url: https://doi.org/10.2519/jospt.2015.5987
  - &id006
    text: 'Breda SJ et al. Effectiveness of progressive tendon-loading exercise therapy in patients with patellar tendinopathy: a randomised clinical trial. BJSM 2021;55:501-9'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8070614/
    free_full_text: true
  review_status: approved
- id: moving-patellar-apprehension
  type: test
  title: Moving Patellar Apprehension Test
  page: 2
  summary: Detects lateral patellar instability by provoking then relieving apprehension.
  steps:
  - Supine, knee extended. Push the patella laterally and hold it there.
  - Flex the knee to 90° and back to full extension while holding the lateral push.
  - Repeat with a medial glide during flexion and extension.
  positive: Apprehension or quadriceps guarding with the lateral glide that disappears with the medial glide.
  metrics: Sn 100% · Sp 88% · PPV 89% · NPV 100% (n = 51; examination under anaesthesia as reference).
  evidence: L
  video_url: https://www.youtube.com/watch?v=IKhEElT8jvQ
  video_title: Moving Patellar Apprehension Test | Patellar Instability
  sources:
  - text: Ahmad CS et al. The moving patellar apprehension test for lateral patellar instability. Am J Sports Med 2009;37:791-6
    url: https://doi.org/10.1177/0363546508328113
  review_status: approved
- id: hoffa-test
  type: test
  title: Hoffa's Test — Infrapatellar Fat Pad
  page: 2
  summary: Provokes fat-pad pain by compressing it as the knee extends.
  steps:
  - Supine with the knee flexed ~30°.
  - Press the thumbs into both sides of the patellar tendon, just below the patella.
  - Ask the patient to straighten the knee (or extend it passively) while you keep the pressure.
  positive: Reproduction of the familiar infrapatellar pain as the knee nears extension.
  evidence: E
  video_url: https://www.youtube.com/watch?v=QdCJU7EQc3k
  video_title: Hoffa's Test | Infrapatellar Fat Pad Syndrome
  sources: []
  review_status: approved
- id: valgus-stress-test
  type: test
  title: Valgus Stress Test — MCL
  page: 2
  summary: Tests the medial collateral ligament; testing at 0° adds information about other restraints.
  steps:
  - Supine, thigh supported, knee at 30° flexion.
  - Stabilise the lateral knee and apply a valgus force at the ankle.
  - Grade the medial opening and the end-point; compare with the other side.
  - Repeat in full extension.
  positive: Pain or laxity at 30° → MCL. Laxity in full extension → combined injury (cruciate / posteromedial corner).
  interpretation: Grade I ≤ 5 mm with firm end-point · II 5–10 mm · III > 10 mm with no end-point.
  evidence: M
  video_url: https://www.youtube.com/watch?v=GSFbttpxCuQ
  video_title: Valgus Stress Test of the Knee | Medial Collateral Ligament
  sources:
  - &id002
    text: 'Logerstedt DS et al. Knee ligament sprain: clinical practice guideline revision 2017. JOSPT 2017;47(11):A1-A47'
    url: https://doi.org/10.2519/jospt.2017.0303
  review_status: approved
- id: joint-line-tenderness
  type: test
  title: Joint Line Tenderness — Meniscus
  page: 2
  summary: Palpation of the medial and lateral joint line for meniscal pain.
  steps:
  - Knee flexed to 90° to open the joint line.
  - Palpate the medial and lateral joint line from anterior to posterior.
  - Compare with the other side; note pain location.
  positive: Familiar, localised pain on the joint line.
  metrics: Pooled Sn 83% · Sp 83% (Smith 2015).
  evidence: M
  video_url: https://www.youtube.com/watch?v=XBle4px05ck
  video_title: Joint Line Tenderness Palpation | Meniscus Tear
  sources:
  - &id001
    text: 'Smith BE et al. Special tests for assessing meniscal tears within the knee: a systematic review and meta-analysis. Evid Based Med 2015;20:88-97'
    url: https://doi.org/10.1136/ebmed-2014-110160
  review_status: approved
- id: mcmurray-test
  type: test
  title: McMurray Test — Meniscus
  page: 2
  summary: Rotational compression through the arc of flexion to provoke a meniscal tear.
  steps:
  - Supine; flex the knee fully.
  - 'Medial meniscus: externally rotate the tibia and apply valgus while extending to 90°.'
  - 'Lateral meniscus: internally rotate the tibia and apply varus while extending.'
  - Feel for a click or clunk on the joint line.
  positive: Joint-line pain and/or a palpable click during the manoeuvre.
  metrics: Pooled Sn 61% · Sp 84% (Smith 2015).
  evidence: M
  video_url: https://www.youtube.com/watch?v=lwDFPAyGGgI
  video_title: McMurray Test | Meniscus Damage
  sources:
  - *id001
  review_status: approved
- id: thessaly-test
  type: test
  title: Thessaly Test (20°) — Meniscus
  page: 2
  summary: Weight-bearing rotational test for meniscal tears.
  steps:
  - Patient stands on the test leg, hands held by the examiner.
  - Flex the knee to 20°.
  - Rotate the body and knee internally and externally three times.
  - Test the healthy knee first.
  positive: Joint-line discomfort or a sense of locking or catching.
  metrics: Pooled Sn 75% · Sp 87% (Smith 2015). The original study reported higher values (Karachalios 2005).
  evidence: M
  video_url: https://www.youtube.com/watch?v=ebraZ4jM36A
  video_title: Thessaly Test⎟Meniscus Lesion
  sources:
  - *id001
  - text: Karachalios T et al. Diagnostic accuracy of a new clinical test (the Thessaly test) for early detection of meniscal tears. J Bone Joint Surg Am 2005;87:955-62
    url: https://doi.org/10.2106/jbjs.d.02338
  review_status: approved
- id: knee-oa-clinical
  type: info
  title: Knee Osteoarthritis — Clinical Diagnosis
  page: 2
  summary: Osteoarthritis is a clinical diagnosis; imaging is not needed when typical.
  steps:
  - 'NICE: age ≥ 45 + activity-related joint pain + no morning stiffness or stiffness ≤ 30 min.'
  - 'ACR clinical criteria: knee pain + ≥ 3 of age > 50, stiffness < 30 min, crepitus, bony tenderness, bony enlargement, no palpable warmth.'
  - Image only with atypical features or suspected alternative diagnosis.
  positive: NICE criteria met or ACR ≥ 3/6 with knee pain.
  interpretation: 'Core treatment: exercise, education, weight management. NICE does not recommend electrotherapy, acupuncture or dry needling for OA.'
  metrics: 'ACR clinical criteria: Sn 95% · Sp 69%.'
  evidence: H
  video_url: null
  calculator:
    kind: formula
    inputs:
    - heading: ACR clinical criteria
    - key: pain
      label: Knee pain (required)
      type: check
    - key: a
      label: Age > 50
      type: check
    - key: b
      label: Morning stiffness < 30 min
      type: check
    - key: c
      label: Crepitus on active motion
      type: check
    - key: d
      label: Bony tenderness
      type: check
    - key: e
      label: Bony enlargement
      type: check
    - key: f
      label: No palpable warmth
      type: check
    expr: 'pain ? (a+b+c+d+e+f) : -1'
    value_label: Criteria met (of 6)
    decimals: 0
    outputs:
    - when: v<0
      text: Knee pain is required
      tone: warn
    - when: v>=3
      text: Meets ACR clinical criteria for knee OA
      tone: bad
    - when: v>=0
      text: ACR criteria not met
      tone: good
  sources:
  - &id007
    text: 'NICE guideline NG226. Osteoarthritis in over 16s: diagnosis and management (2022)'
    url: https://www.nice.org.uk/guidance/ng226
    free_full_text: true
  - text: Altman R et al. Development of criteria for the classification and reporting of osteoarthritis of the knee. Arthritis Rheum 1986;29:1039-49
    url: https://doi.org/10.1002/art.1780290816
  review_status: approved
- id: noble-test
  type: test
  title: Noble Compression Test — ITB Syndrome
  page: 2
  summary: Provokes iliotibial band pain over the lateral femoral epicondyle.
  steps:
  - Supine, knee flexed to 90°.
  - Press the thumb on the ITB just above the lateral femoral epicondyle.
  - Extend the knee slowly while keeping the pressure.
  positive: Familiar lateral pain at about 30° of flexion.
  evidence: E
  video_url: https://www.youtube.com/watch?v=PmUGl7ryQOo
  video_title: Noble Compression / Noble's Test | Iliotibial Band Friction Syndrome ITBS
  sources: []
  review_status: approved
- id: ober-test
  type: test
  title: Ober Test — Lateral Hip / ITB Tension
  page: 2
  summary: Assesses tension of the lateral hip soft tissues (TFL / gluteal–ITB complex).
  steps:
  - Side-lying on the unaffected side, lower hip and knee flexed.
  - Stabilise the pelvis; abduct and extend the top hip with the knee flexed 90° (or extended for the modified test).
  - Release the leg and let it drop toward the table.
  positive: Leg stays abducted (does not drop to horizontal). Measures tissue tension, not ITB length; reliability is moderate.
  evidence: L
  video_url: https://www.youtube.com/watch?v=Amjv6FzDeLE
  video_title: Ober's Test | Iliotibial Band Tightness
  sources: []
  review_status: approved
- id: varus-stress-test
  type: test
  title: Varus Stress Test — LCL / Posterolateral Corner
  page: 2
  summary: Tests the lateral collateral ligament; laxity in extension implicates the posterolateral corner and cruciates.
  steps:
  - Supine, knee at 30° flexion, thigh supported.
  - Stabilise the medial knee and apply a varus force at the ankle.
  - Grade the lateral opening and end-point; compare sides.
  - Repeat in full extension.
  positive: Pain or laxity at 30° → LCL. Laxity in full extension → posterolateral corner + cruciate injury.
  evidence: M
  video_url: https://www.youtube.com/watch?v=sg1gk6QKARw
  video_title: Varus Stress Test of the Knee | Lateral Collateral Ligament Injury
  sources:
  - *id002
  review_status: approved
- id: dial-test
  type: test
  title: Dial Test — Posterolateral Corner
  page: 2
  summary: Compares tibial external rotation at 30° and 90° of knee flexion.
  steps:
  - Prone (or supine) with knees together at 30° flexion.
  - Externally rotate both feet; measure the thigh–foot angle.
  - Repeat at 90° flexion.
  positive: '> 10° more external rotation than the other side. At 30° only → isolated posterolateral corner; at 30° and 90° → posterolateral corner + PCL.'
  evidence: E
  video_url: https://www.youtube.com/watch?v=3UGffd71KyI
  video_title: Dial Test / Loomer Test | Posterolateral Rotatory Instability of the Knee
  sources:
  - *id002
  review_status: approved
- id: posterior-sag
  type: test
  title: Posterior Sag (Godfrey) Sign — PCL
  page: 2
  summary: Gravity lets the tibia drop backward when the PCL is torn.
  steps:
  - Supine, hips and knees flexed to 90°, heels supported (or knees flexed 90° with feet on the table).
  - Look across both knees from the side at the tibial tubercles.
  positive: The tibial tubercle sits lower (posterior) on the injured side.
  evidence: M
  video_url: https://www.youtube.com/watch?v=7vgTMnfP4fs
  video_title: Posterior Sag Sign | Posterior Cruciate Ligament Tear
  sources:
  - &id003
    text: Rubinstein RA et al. The accuracy of the clinical examination in the setting of posterior cruciate ligament injuries. Am J Sports Med 1994;22:550-7
    url: https://doi.org/10.1177/036354659402200419
  review_status: approved
- id: posterior-drawer
  type: test
  title: Posterior Drawer Test — PCL
  page: 2
  summary: Most accurate single clinical test for PCL injury.
  steps:
  - Supine, knee at 90°, foot stabilised.
  - Check the resting medial tibial step-off first (normally ~1 cm anterior to the femoral condyle).
  - Push the proximal tibia posteriorly; grade the translation and end-point.
  positive: 'Increased posterior translation or a soft end-point. Grade I: tibia still anterior to condyles · II: flush · III: behind the condyles (suspect combined injury).'
  metrics: 'Clinical examination overall: Sn 90% · Sp 99%; posterior drawer was the most sensitive and specific test (Rubinstein 1994).'
  evidence: M
  video_url: https://www.youtube.com/watch?v=wDIGll5wzZs
  video_title: Posterior Drawer Test | Posterior Cruciate Ligament
  sources:
  - *id003
  review_status: approved
- id: lachman-test
  type: test
  title: Lachman Test — ACL
  page: 2
  summary: Best single clinical test for ACL rupture.
  steps:
  - Supine, knee at 20–30° flexion, hamstrings relaxed.
  - One hand stabilises the distal femur, the other pulls the proximal tibia anteriorly.
  - Judge the amount of translation and the end-point; compare with the other side.
  positive: Increased anterior translation and/or a soft end-point.
  metrics: Pooled Sn 85% · Sp 94% (Benjaminse 2006).
  evidence: H
  video_url: https://www.youtube.com/watch?v=JFkbKNNa7xQ
  video_title: Lachman Test | Cruciate Ligament
  sources:
  - &id004
    text: 'Benjaminse A et al. Clinical diagnosis of an anterior cruciate ligament rupture: a meta-analysis. JOSPT 2006;36:267-88'
    url: https://doi.org/10.2519/jospt.2006.2011
  review_status: approved
- id: meniscal-composite
  type: info
  title: Meniscal Tear — Composite Examination
  page: 2
  summary: Combining history and examination findings is more useful than any single meniscal test.
  steps:
  - History of catching or locking.
  - Pain on forced hyperextension.
  - Pain on maximal passive flexion.
  - Pain or audible click with the McMurray manoeuvre.
  - Joint line tenderness.
  positive: Count the positive findings out of 5.
  interpretation: '5/5: PPV 92%. ≥ 3/5: PPV > 75% when ACL tear and OA are absent.'
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: a
      label: History of catching or locking
      type: check
    - key: b
      label: Pain with forced hyperextension
      type: check
    - key: c
      label: Pain with maximal passive flexion
      type: check
    - key: d
      label: Pain or audible click with McMurray
      type: check
    - key: e
      label: Joint line tenderness
      type: check
    expr: a+b+c+d+e
    value_label: Positive findings (of 5)
    decimals: 0
    outputs:
    - when: v==5
      text: 5/5 — PPV 92% for meniscal tear
      tone: bad
    - when: v>=3
      text: ≥ 3/5 — PPV > 75% (if no ACL tear / OA)
      tone: warn
    - when: v>=0
      text: < 3/5 — meniscal tear less likely on examination
      tone: good
  sources:
  - text: Lowery DJ et al. A clinical composite score accurately detects meniscal pathology. Arthroscopy 2006;22:1174-9
    url: https://doi.org/10.1016/j.arthro.2006.06.014
  - text: 'Logerstedt DS et al. Meniscal and articular cartilage lesions: clinical practice guideline revision 2018. JOSPT 2018;48(2):A1-A50'
    url: https://doi.org/10.2519/jospt.2018.0301
  review_status: approved
- id: wilson-test
  type: test
  title: Wilson's Test — Osteochondritis Dissecans
  page: 2
  summary: Historical provocation test for medial femoral condyle OCD; low diagnostic value — imaging decides.
  steps:
  - Sitting, knee flexed to 90°.
  - Internally rotate the tibia and slowly extend the knee.
  - Pain around 30° that is relieved by external rotation of the tibia is the classic positive.
  positive: Pain at ~30° relieved by tibial external rotation.
  interpretation: Of minimal diagnostic value; can be used to monitor a known lesion.
  evidence: L
  video_url: null
  sources:
  - text: 'Conrad JM, Stanitski CL. Osteochondritis dissecans: Wilson''s sign revisited. Am J Sports Med 2003;31:777-8'
    url: https://doi.org/10.1177/03635465030310052301
  review_status: approved
- id: prone-knee-bend
  type: test
  title: Prone Knee Bend — Femoral Nerve
  page: 2
  summary: Neurodynamic test for the femoral nerve and L2–L4 roots.
  steps:
  - Prone; stabilise the pelvis.
  - Passively flex the knee; add hip extension if needed.
  - Note the onset of symptoms and their location.
  - 'Structural differentiation: side-lying slump knee bend and change neck flexion.'
  positive: Familiar anterior thigh / knee symptoms that change with structural differentiation.
  evidence: L
  video_url: https://www.youtube.com/watch?v=whb3Rknage0
  video_title: Reversed Lasègue / Prone Knee Bend Test | Lumbar Radicular Syndrome
  sources: []
  review_status: approved
- id: slump-test
  type: test
  title: Slump Test — Sciatic / Tibial
  page: 2
  summary: Neurodynamic test of the posterior lower-limb neural tissues.
  steps:
  - Sitting; slump the trunk and flex the neck.
  - Extend the knee and dorsiflex the ankle.
  - Release neck flexion and note any change in symptoms.
  positive: Familiar symptoms that ease when the neck is extended (structural differentiation).
  evidence: M
  video_url: https://www.youtube.com/watch?v=HFGfP84uwEo
  video_title: The SLUMP Test | Neurodynamic Testing
  sources: []
  review_status: approved
- id: fadir-faber
  type: test
  title: FADIR / FABER — Hip Screen
  page: 2
  summary: Quick hip provocation tests to rule out a hip source of knee pain.
  steps:
  - 'FADIR: supine; flex the hip to 90°, then adduct and internally rotate.'
  - 'FABER: place the foot on the opposite knee; let the knee fall outward and apply gentle pressure.'
  - Note pain location (groin / buttock / lateral hip) and compare sides.
  positive: Reproduction of familiar groin or hip pain → examine the hip properly.
  evidence: L
  video_url: https://www.youtube.com/watch?v=xyJUIhsL4lg
  video_title: FADDIR Test
  sources: []
  review_status: approved
- id: apley-test
  type: test
  title: Apley's Test — Meniscus vs Ligament
  page: 4
  summary: Compression (grind) and distraction in prone; low accuracy — use within the meniscal composite.
  steps:
  - Prone with the knee at 90°.
  - Compress through the heel while rotating the tibia (grind).
  - Then distract and rotate.
  positive: Pain with compression (meniscus) more than with distraction (ligament).
  evidence: L
  video_url: https://www.youtube.com/watch?v=6Z_9lfX_Pc8
  video_title: Apley's Test | Meniscus Injury
  sources:
  - *id001
  review_status: approved
- id: knee-rom
  type: info
  title: Knee Range of Motion & Heel-Height Difference
  page: 3
  summary: Loss of full extension is the key early warning after knee injury and surgery.
  steps:
  - 'Goniometer: axis on the lateral femoral epicondyle, arms to the greater trochanter and lateral malleolus.'
  - 'Extension: supine with the heel on a bolster; record hyperextension as negative.'
  - 'Heel-height difference: prone with the legs off the table edge; measure the height difference between heels.'
  - 'Flexion: supine heel slide.'
  interpretation: 'Any extension deficit compared with the other side is clinically relevant. Heel-height: ≈ 1 cm ≈ 1° of extension loss. Functional flexion: gait ≈ 65°, stairs ≈ 90–100°, squat ≥ 115°.'
  metrics: Goniometric error ≈ 3–5° between sessions.
  evidence: E
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: h
      label: Heel-height difference (cm)
      type: number
    expr: h
    value_label: Estimated extension deficit (°)
    decimals: 0
    outputs:
    - when: v>1
      text: Extension deficit likely — prioritise extension
      tone: warn
    - when: v<=1
      text: Within ~1°
      tone: good
  sources: []
  review_status: approved
- id: patellar-mobility
  type: test
  title: Patellar Mobility (Glides & Quadrants)
  page: 3
  summary: Restricted patellar glides after surgery predict stiffness and patella infera; excess lateral glide suggests instability.
  steps:
  - Supine, knee extended and relaxed (or 20–30° flexed for the lateral glide).
  - Divide the patella width into 4 quadrants.
  - Glide medially and laterally; count quadrants of displacement.
  - Glide superiorly and inferiorly; compare sides.
  positive: 'Hypomobile: < 1 quadrant. Hypermobile: ≥ 3 quadrants laterally (instability).'
  evidence: E
  video_url: null
  sources: []
  review_status: approved
- id: beighton
  type: info
  title: Beighton Score — Generalised Joint Hypermobility
  page: 3
  summary: Nine-point screen for generalised joint hypermobility; relevant to patellar instability.
  steps:
  - Little finger passive dorsiflexion > 90° (1 point each side).
  - Thumb passively to the forearm (1 each side).
  - Elbow hyperextension > 10° (1 each side).
  - Knee hyperextension > 10° (1 each side).
  - Palms flat on the floor with knees straight (1).
  interpretation: 'Hypermobile: ≥ 5/9 adults up to 50 y · ≥ 6/9 children · ≥ 4/9 over 50 y.'
  evidence: M
  video_url: https://www.youtube.com/watch?v=ZwWts_P-Xws
  video_title: The Beighton Score | Generalized Joint Hypermobility (Laxity)
  calculator:
    kind: formula
    inputs:
    - key: age
      label: Age (years)
      type: number
    - heading: Left / right
    - key: f1
      label: Little finger > 90° — left
      type: check
    - key: f2
      label: Little finger > 90° — right
      type: check
    - key: t1
      label: Thumb to forearm — left
      type: check
    - key: t2
      label: Thumb to forearm — right
      type: check
    - key: e1
      label: Elbow hyperextension > 10° — left
      type: check
    - key: e2
      label: Elbow hyperextension > 10° — right
      type: check
    - key: k1
      label: Knee hyperextension > 10° — left
      type: check
    - key: k2
      label: Knee hyperextension > 10° — right
      type: check
    - heading: Trunk
    - key: tr
      label: Palms flat on floor, knees straight
      type: check
    expr: f1+f2+t1+t2+e1+e2+k1+k2+tr
    value_label: Beighton score (of 9)
    decimals: 0
    outputs:
    - when: (age<18 && v>=6) || (age>=18 && age<=50 && v>=5) || (age>50 && v>=4)
      text: Generalised joint hypermobility (age-specific cut-off met)
      tone: bad
    - when: isNaN(age)
      text: Enter age to apply the age-specific cut-off
      tone: warn
    - when: v>=0
      text: Below the age-specific cut-off
      tone: good
  sources:
  - text: Malek S et al. The Beighton Score as a measure of generalised joint hypermobility. Rheumatol Int 2021;41:1707-16
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8390395/
    free_full_text: true
  review_status: approved
- id: hhd-testing
  type: info
  title: Hand-Held Dynamometry — Knee & Hip
  page: 3
  summary: Quantifies strength for limb symmetry and progression; fix the dynamometer with a strap for the quadriceps.
  steps:
  - 'Quadriceps: seated, knee 60–90°, strap the dynamometer to the table frame; 3 × 5 s maximal efforts, 30 s rest.'
  - 'Hamstrings: prone or seated at 90°. Hip abductors: side-lying with a strap above the knee.'
  - Record the best of 3 trials in newtons; measure the lever arm (joint centre to dynamometer).
  - Torque (Nm/kg) = force (N) × lever arm (m) ÷ body mass (kg). LSI = involved ÷ uninvolved × 100.
  interpretation: Hand-held testing without a strap underestimates strong quadriceps (tester strength limits).
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: f
      label: Force (N)
      type: number
    - key: l
      label: Lever arm (m)
      type: number
    - key: m
      label: Body mass (kg)
      type: number
    expr: f*l/m
    value_label: Torque (Nm/kg)
    decimals: 2
    outputs: []
  sources:
  - &id011
    text: 'Grindem H et al. Simple decision rules can reduce reinjury risk by 84% after ACL reconstruction: the Delaware-Oslo ACL cohort study. BJSM 2016;50:804-8'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4912389/
    free_full_text: true
  review_status: approved
- id: oarsi-performance-tests
  type: info
  title: OARSI Performance-Based Tests (Knee OA)
  page: 3
  summary: Recommended core set of physical performance tests for hip and knee osteoarthritis.
  steps:
  - '30-s chair stand: number of full stands in 30 s, arms crossed.'
  - '40-m fast-paced walk: 4 × 10 m as fast as safely possible; report speed (m/s).'
  - 'Stair climb test: time to ascend and descend a flight of stairs.'
  - 'Optional: Timed Up and Go, 6-minute walk.'
  interpretation: Use the same protocol at each re-test; compare with the patient's own baseline.
  evidence: H
  video_url: null
  sources:
  - text: Dobson F et al. Reliability and measurement error of the OARSI recommended performance-based tests of physical function in hip and knee OA. Osteoarthritis Cartilage 2017;25:1792-6
    url: https://doi.org/10.1016/j.joca.2017.06.006
  review_status: approved
- id: lateral-step-down
  type: test
  title: Lateral Step-Down Test — Quality of Movement
  page: 3
  summary: Five-criterion movement score from a 20 cm step (Piva).
  steps:
  - Stand on a 20 cm step, hands on waist; lower the other heel to touch the floor and return, 5 times.
  - 'Add 1 point each: arm strategy, trunk lean, pelvis rotates or elevates, unsteady stance.'
  - 'Knee position: tibial tuberosity medial to the 2nd toe = 1; medial to the medial border of the foot = 2.'
  positive: Total 0–1 good · 2–3 moderate · ≥ 4 poor.
  metrics: Inter-tester reliability moderate (Piva 2006).
  evidence: M
  video_url: null
  calculator:
    kind: formula
    inputs:
    - key: a
      label: Arm strategy
      type: check
    - key: t
      label: Trunk lean
      type: check
    - key: p
      label: Pelvis rotates / elevates
      type: check
    - key: k
      label: Knee position
      type: select
      options:
      - - 0
        - Tuberosity over 2nd toe or lateral
      - - 1
        - Medial to 2nd toe
      - - 2
        - Medial to the medial border of the foot
    - key: u
      label: Unsteady stance / steps down
      type: check
    expr: a+t+p+k+u
    value_label: Score (0–6)
    decimals: 0
    outputs:
    - when: v>=4
      text: Poor quality of movement
      tone: bad
    - when: v>=2
      text: Moderate quality
      tone: warn
    - when: v>=0
      text: Good quality
      tone: good
  sources:
  - text: Piva SR et al. Reliability of measures of impairments associated with patellofemoral pain syndrome. BMC Musculoskelet Disord 2006;7:33
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1557500/
    free_full_text: true
  review_status: approved
- id: y-balance
  type: test
  title: Y-Balance Test — Lower Quarter
  page: 8
  summary: Dynamic single-leg balance in anterior, posteromedial and posterolateral reach directions.
  steps:
  - Stand on one leg on the centre plate; reach as far as possible with the other foot in each direction.
  - 3 trials per direction after practice; record the best.
  - Normalise to leg length for the composite score.
  positive: Anterior reach asymmetry > 4 cm flags higher injury risk.
  metrics: 'Anterior asymmetry > 4 cm: ≈ 2.5 × injury odds (Plisky 2006).'
  evidence: M
  video_url: https://www.youtube.com/watch?v=qFVuS-P2FrI
  video_title: Y-Balance Test
  sources:
  - text: Plisky PJ et al. Star Excursion Balance Test as a predictor of lower extremity injury in high school basketball players. JOSPT 2006;36:911-9
    url: https://doi.org/10.2519/jospt.2006.2244
  review_status: approved
- id: acl-cluster
  type: info
  title: ACL Rupture — Clinical Cluster
  page: 4
  summary: History plus the Lachman test is the backbone; the pivot shift rules in when positive.
  steps:
  - 'History: non-contact pivot or deceleration, a "pop", swelling within 2 h, giving way.'
  - Lachman first (best sensitivity). Pivot shift if the patient can relax (best specificity).
  - Anterior drawer helps in chronic presentations; lever sign is an alternative when the patient is guarding.
  interpretation: Each statistic belongs to its own test; there is no validated combined cluster value.
  evidence: H
  video_url: null
  sources:
  - *id004
  - &id005
    text: 'Hu S et al. Lever sign test for anterior cruciate ligament injuries: a diagnostic meta-analysis. J Orthop Surg Res 2024;19:155'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10905791/
    free_full_text: true
  review_status: approved
- id: pivot-shift
  type: test
  title: Pivot Shift Test — ACL
  page: 4
  summary: Reproduces the anterolateral rotatory subluxation of ACL deficiency.
  steps:
  - Supine, knee extended; internally rotate the tibia and apply valgus.
  - Flex the knee slowly from extension.
  - Feel for the lateral tibial plateau reducing with a clunk at ~20–40°.
  positive: A clunk or glide as the tibia reduces. Often negative in an awake, guarding patient.
  metrics: Pooled Sn 24% · Sp 98% (Benjaminse 2006).
  evidence: H
  video_url: https://www.youtube.com/watch?v=qqy5IfkEvfw
  video_title: The Lateral Pivot-Shift Test for Anterior Cruciate Ligament Rupture
  sources:
  - *id004
  review_status: approved
- id: anterior-drawer
  type: test
  title: Anterior Drawer Test — ACL
  page: 4
  summary: Anterior tibial translation at 90°; useful in chronic injury, unreliable acutely (pain, effusion, hamstring guarding).
  steps:
  - Supine, hip 45°, knee 90°, sit on the foot.
  - Check the hamstrings are relaxed.
  - Pull the proximal tibia forward; compare translation and end-point.
  positive: Increased anterior translation compared with the other side.
  metrics: 'Chronic: pooled Sn 92% · Sp 91% (Benjaminse 2006).'
  evidence: M
  video_url: https://www.youtube.com/watch?v=IdnBKv38EEQ
  video_title: Anterior Drawer Test | Anterior Cruciate Ligament Rupture
  sources:
  - *id004
  review_status: approved
- id: lever-sign
  type: test
  title: Lever Sign (Lelli's Test) — ACL
  page: 4
  summary: Uses the tibia as a lever over a fist placed under the calf.
  steps:
  - Supine, knee extended. Place a fist under the proximal third of the calf.
  - Push down on the distal quadriceps.
  - Watch the heel.
  positive: Heel stays on the table (does not rise) → ACL rupture.
  metrics: Pooled Sn 81% · Sp 78% · +LR 3.1 · −LR 0.21 (12 studies, Hu 2024).
  evidence: M
  video_url: https://www.youtube.com/watch?v=T9ujIYIctdw
  video_title: The Lever Sign or Lelli's Test | Anterior Cruciate Ligament Rupture
  sources:
  - *id005
  review_status: approved
- id: quadriceps-active-test
  type: test
  title: Quadriceps Active Test — PCL
  page: 4
  summary: A quadriceps contraction pulls a posteriorly sagged tibia forward.
  steps:
  - Supine, knee at 90°, foot stabilised.
  - Look for posterior sag.
  - Ask the patient to slide the foot forward gently against your hand.
  positive: Visible anterior shift of the tibia from a sagged position.
  evidence: M
  video_url: https://www.youtube.com/watch?v=tQCacgQgC-s
  video_title: Quadriceps Active Test / Active Drawer Test | Posterior Cruciate Ligament Tear
  sources:
  - *id003
  review_status: approved
- id: single-leg-decline-squat
  type: test
  title: Single-Leg Decline Squat — Tendon Load Test
  page: 4
  summary: Loads the patellar tendon; the pain rating (0–10) is used to monitor tendinopathy.
  steps:
  - Stand on one leg on a 25° decline board, trunk upright.
  - Squat slowly to the painful range or 60–90° knee flexion.
  - Rate pain 0–10 at the same depth each time.
  positive: Inferior-pole pain that increases with depth or load. Use the rating to guide progression (≤ 3/10 to progress).
  evidence: M
  video_url: null
  sources:
  - *id006
  review_status: approved
- id: koos
  type: info
  title: KOOS — Knee Injury & Osteoarthritis Outcome Score
  page: 4
  summary: '42 items in 5 subscales: Pain, Symptoms, ADL, Sport/Recreation, Quality of Life. 0 = extreme problems, 100 = no problems.'
  steps:
  - Patient completes all 42 items (last week).
  - Score each subscale separately 0–100; do not sum into one total.
  - KOOS4 (mean of Pain, Symptoms, Sport/Rec, QOL) is often used after ACL injury.
  interpretation: MCID ≈ 8–10 points per subscale.
  evidence: M
  video_url: null
  sources:
  - text: 'Roos EM, Lohmander LS. The Knee injury and Osteoarthritis Outcome Score (KOOS): from joint injury to osteoarthritis. Health Qual Life Outcomes 2003;1:64'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC280702/
    free_full_text: true
  review_status: approved
- id: ikdc
  type: info
  title: IKDC Subjective Knee Form
  page: 4
  summary: 18-item knee-specific measure of symptoms, function and sport activity (0–100).
  steps:
  - Patient completes all items.
  - Score 0–100 (higher = better).
  interpretation: MCID 11.5 points at 6 months (20.5 at 12 months); MDC95 ≈ 12.8 points.
  evidence: M
  video_url: null
  sources:
  - text: Irrgang JJ et al. Responsiveness of the International Knee Documentation Committee Subjective Knee Form. Am J Sports Med 2006;34:1567-73
    url: https://doi.org/10.1177/0363546506288855
  review_status: approved
- id: kujala-akps
  type: info
  title: Kujala / Anterior Knee Pain Scale (AKPS)
  page: 4
  summary: 13-item scale for patellofemoral pain, 0–100 (higher = better).
  steps:
  - Patient completes all 13 items.
  - Sum the item scores (max 100).
  interpretation: Minimal important change ≈ 10 points.
  evidence: M
  video_url: null
  sources:
  - text: 'Crossley KM et al. Analysis of outcome measures for persons with patellofemoral pain: which are reliable and valid? Arch Phys Med Rehabil 2004;85:815-22'
    url: https://doi.org/10.1016/s0003-9993(03)00613-0
  review_status: approved
- id: visa-p
  type: info
  title: VISA-P — Patellar Tendinopathy
  page: 4
  summary: 8-item questionnaire on pain, function and sport for patellar tendinopathy, 0–100 (100 = asymptomatic).
  steps:
  - Patient completes all 8 questions (question 8 has three branches — answer only one).
  - Sum the item scores (0–100) and track the trend across the loading programme.
  interpretation: In the 2021 progressive-loading trial, scores improved by 28 points (vs 18 with eccentric training) over 24 weeks.
  evidence: M
  video_url: null
  calculator:
    kind: scale
    items: 8
    min: 0
    max: 10
    note: 'Item topics are summarised from the VISA-P (Visentini 1998); use the official form for exact wording. 100 = no symptoms.'
    item_labels:
    - How many minutes you can sit pain-free
    - Pain walking downstairs with a normal gait
    - Pain at full active knee extension, non-weight-bearing
    - Pain doing a full weight-bearing lunge
    - Problems squatting
    - Pain during or straight after 10 single-leg hops
    - Current sport / physical activity
    - Training / practice time (pick the ONE line that fits)
    item_options:
