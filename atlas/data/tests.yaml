- id: less-landing
  type: test
  title: Landing Error Scoring System (LESS)
  page: 8
  summary: Jump-landing task scored for technique errors from video (front and side).
  steps:
  - Jump from a 30 cm box to a target at half the athlete's height, then rebound vertically.
  - Film from the front and side; score errors at initial contact and through landing (knee valgus, stiff landing, asymmetry, trunk).
  - Lower scores = better technique.
  positive: ≥ 5 errors = cut-point associated with ACL injury in elite youth soccer.
  metrics: 'Cut-point 5: Sn 86% · Sp 64% (7 ACL injuries — small sample).'
  evidence: L
  video_url: null
  sources:
  - text: Padua DA et al. The Landing Error Scoring System as a screening tool for an ACL injury-prevention program in elite-youth soccer athletes. J Athl Train 2015;50:589-95
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4527442/
    free_full_text: true
  review_status: approved
